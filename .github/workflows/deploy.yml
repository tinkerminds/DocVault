name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # CI Checks — must pass before deploy
  # ──────────────────────────────────────────────
  frontend-ci:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test

  # ──────────────────────────────────────────────
  # Deploy Angular to Azure Static Web Apps
  # ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    needs: frontend-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build for production
        run: npm run build -- --configuration=production
        working-directory: frontend

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist/DocVault.Web/browser
          skip_app_build: true

  # ──────────────────────────────────────────────
  # Backend CI — .NET 8
  # ──────────────────────────────────────────────
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/DocVault.Api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore

  # ──────────────────────────────────────────────
  # Deploy .NET API to App Service
  # ──────────────────────────────────────────────
  deploy-api:
    name: Deploy API
    needs: backend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish -c Release -o ./publish
        working-directory: backend/DocVault.Api
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: docvault-api-dev
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend/DocVault.Api/publish

  # ──────────────────────────────────────────────
  # Deploy Function App to Azure
  # ──────────────────────────────────────────────
  deploy-functions:
    name: Deploy Functions
    needs: backend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Functions
        run: dotnet publish -c Release -o ./publish
        working-directory: functions/DocVault.Functions
      - name: Deploy to Azure Function App
        uses: azure/webapps-deploy@v3
        with:
          app-name: docvault-func-dev
          package: functions/DocVault.Functions/publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
