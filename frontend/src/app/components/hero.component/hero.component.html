<div class="hero">
  <div class="hero-background"></div>
  <div class="hero-content">
    <div class="hero-text">
      <span class="hero-badge">Secure Enterprise Platform</span>
      <h1 class="hero-title">
        Securely Manage Your
        <span class="text-primary">Professional Documents</span>
      </h1>
      <p class="hero-description">
        The central hub for all your internal files. Access, store, and share with
        enterprise-grade security and speed.
      </p>
    </div>

    <div class="hero-buttons">
      <button class="btn-primary" routerLink="/upload">
        <span class="material-symbols-outlined">upload_file</span>

      <button class="btn-secondary" routerLink="/documents">
        <span class="material-symbols-outlined">search</span>

    <div class="hero-formats">
      <div class="formats-icons">

        </div>
        <div class="format-icon sheets">
          <span class="material-symbols-outlined">table_view</span>
        </div>
        <div class="format-icon image">
          <span class="material-symbols-outlined">image</span>
        </div>
        <div class="format-icon code">
          <span class="material-symbols-outlined">code</span>
        </div>
      </div>
      <span class="formats-text">Supported Formats</span>
