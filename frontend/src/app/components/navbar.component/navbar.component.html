<header class="navbar">
  <div class="navbar-container">
    <!-- Logo - clickable, routes to home -->
    <div class="navbar-logo" (click)="navigateToHome()">
      <div class="logo-icon">
        <span class="material-symbols-outlined">folder_shared</span>
      </div>
      <h2 class="logo-text">DocVault</h2>
    </div>

    <div class="navbar-content">
      <nav class="navbar-nav">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
          >Home</a
        >
        <a routerLink="/documents" routerLinkActive="active" class="nav-link">Documents</a>
        <button class="nav-link search-btn" [class.active]="isSearchOpen" (click)="toggleSearch()">
          Search
        </button>
      </nav>

      <div class="navbar-actions">
        <!-- Show when authenticated -->
        <ng-container *ngIf="isAuthenticated">
          <button class="btn-upload" routerLink="/upload">
            <span class="text">Upload</span>
          </button>
          <button class="btn-icon">
            <span class="material-symbols-outlined">notifications</span>
          </button>
          <div class="user-info" (click)="logout()" title="Click to logout">
            <div class="avatar">
              <span class="material-symbols-outlined">account_circle</span>
            </div>
            <span class="user-name">{{ userName }}</span>
          </div>
        </ng-container>

        <!-- Show when NOT authenticated -->
        <ng-container *ngIf="!isAuthenticated">
          <button class="btn-login" (click)="login()">
            <span class="material-symbols-outlined">login</span>
            <span class="text">Sign In</span>
          </button>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- Search Overlay Dropdown -->
  <div class="search-overlay" *ngIf="isSearchOpen">
    <div class="search-overlay-inner">
      <div class="search-input-wrapper">
        <span class="material-symbols-outlined search-icon">search</span>
        <input
          class="search-overlay-input"
          type="text"
          placeholder="Search documents..."
          [(ngModel)]="searchQuery"
          (input)="onSearchInput(searchQuery)"
          autocomplete="off"
        />
        <button class="search-close-btn" (click)="closeSearch()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Results -->
      <div class="search-results">
        <div *ngIf="isLoadingSearch" class="search-state">
          <span class="material-symbols-outlined spin">progress_activity</span>
          <span>Loading...</span>
        </div>

        <div
          *ngIf="!isLoadingSearch && filteredDocuments.length === 0 && searchQuery.trim()"
          class="search-state"
        >
          <span class="material-symbols-outlined">search_off</span>
          <span>No documents found for "{{ searchQuery }}"</span>
        </div>

        <div
          *ngIf="!isLoadingSearch && filteredDocuments.length === 0 && !searchQuery.trim()"
          class="search-state"
        >
          <span class="material-symbols-outlined">folder_open</span>
          <span>No documents available</span>
        </div>

        <div
          *ngIf="!searchQuery.trim() && filteredDocuments.length > 0"
          class="search-section-label"
        >
          Recent Documents
        </div>
        <div
          *ngIf="searchQuery.trim() && filteredDocuments.length > 0"
          class="search-section-label"
        >
          Results for "{{ searchQuery }}"
        </div>

        <button
          *ngFor="let doc of filteredDocuments"
          class="search-result-item"
          (click)="navigateToDocument(doc)"
        >
          <div class="result-icon">
            <span class="material-symbols-outlined">{{ getFileIcon(doc.fileName) }}</span>
          </div>
          <div class="result-info">
            <span class="result-name">{{ doc.fileName }}</span>
            <span class="result-meta">{{ formatFileSize(doc.sizeBytes) }}</span>
          </div>
          <span class="material-symbols-outlined result-arrow">chevron_right</span>
        </button>
      </div>
    </div>
  </div>
</header>
